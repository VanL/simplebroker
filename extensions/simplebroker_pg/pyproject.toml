[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "simplebroker-pg"
version = "4.7.0"
description = "Postgres backend plugin for SimpleBroker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE"]
authors = [
    {name = "Van Lindberg", email = "van.lindberg@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "simplebroker>=8.7.0",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[project.entry-points."simplebroker.backends"]
postgres = "simplebroker_pg.plugin:get_backend_plugin"

[tool.uv.sources]
simplebroker = { path = "../..", editable = true }

[tool.hatch.build]
include = [
    "/simplebroker_pg/**/*.py",
    "/simplebroker_pg/py.typed",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "pg_only: tests that validate the Postgres extension package",
]
