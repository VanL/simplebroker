name: Fuzz

# Weekly coverage-guided fuzzing of the parser surfaces via Atheris, driving
# the existing Hypothesis properties through their external-fuzzer hook
# (see fuzz/*.py). Crashes are real property violations: the failing example
# lands in the Hypothesis database artifact and replays with plain pytest.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "latest"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        harness: [timestamp_validate, dump_load, cli_args]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: sync-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Pinned below latest: Atheris wheels lag the newest CPython.
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install
        run: uv sync --frozen --extra dev --group fuzz --python "${{ steps.sync-python.outputs.python-path }}"

      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.harness }}
          # Per-run key + prefix restore: each run saves an evolved corpus,
          # the next run restores the most recent one.
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.harness }}-

      - name: Fuzz (15 minutes)
        run: |
          mkdir -p fuzz/corpus/${{ matrix.harness }}
          uv run --frozen --no-sync python fuzz/fuzz_${{ matrix.harness }}.py \
            fuzz/corpus/${{ matrix.harness }} \
            -max_total_time=900 -print_final_stats=1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.harness }}
          path: |
            crash-*
            .hypothesis/
          if-no-files-found: ignore
