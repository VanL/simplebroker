name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Check uv policy and lockfiles
      run: python bin/bump_uv.py --check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Diagnostic branch only. Restore the canonical matrix before landing.
        os: [windows-latest]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python ${{ matrix.python-version }}
      id: matrix-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python "${{ steps.matrix-python.outputs.python-path }}"

    - name: Verify matrix Python
      run: |
        uv run --frozen --no-sync python -c "import sys; expected = tuple(map(int, '${{ matrix.python-version }}'.split('.'))); assert sys.version_info[:2] == expected, (sys.version, expected)"

    - name: Run tests with pytest
      if: matrix.os != 'windows-latest'
      run: |
        uv run --frozen --no-sync pytest -v --tb=short -m "not benchmark" --override-ini="addopts=-ra -q --strict-markers -n auto --dist loadgroup --max-worker-restart=0"

    - name: Run Windows tests with pytest
      if: matrix.os == 'windows-latest' && matrix.python-version != '3.14'
      env:
        # Diagnostic amplification only; not a retained test or product remedy.
        SIMPLEBROKER_TERMINAL_PROBE_ITERATIONS: "2000"
      run: |
        uv run --frozen --no-sync pytest -s -v --tb=short -m "not benchmark" --override-ini="addopts=-ra -q --strict-markers -n auto --dist loadgroup --timeout=180 --timeout-method=thread --max-worker-restart=0" tests/test_sqlite_terminal_progress_probe.py

    - name: Run SQLite cross-thread finalization probe
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      env:
        SIMPLEBROKER_RUN_FINALIZATION_PROBE: "1"
        PYTEST_ADDOPTS: ""
      run: |
        test "${SIMPLEBROKER_RUN_FINALIZATION_PROBE}" = "1"
        uv run --frozen --no-sync pytest -n0 -q tests/test_cross_thread_generator_probe.py

    - name: Run Windows tests with coverage
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      timeout-minutes: 45
      env:
        COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync coverage erase
        uv run --frozen --no-sync pytest --tb=short -m "not benchmark" --override-ini="addopts=-ra -vv --strict-markers -n auto --dist loadgroup --timeout=180 --timeout-method=thread --max-worker-restart=0" --cov=simplebroker --cov=extensions/simplebroker_pg/simplebroker_pg --cov=extensions/simplebroker_redis/simplebroker_redis --cov-report= --cov-fail-under=0

    - name: Run phaselock fallback-path gate
      if: matrix.os != 'windows-latest' || matrix.python-version == '3.14'
      env:
        PHASELOCK_ENABLE_XATTRS: "0"
      run: |
        uv run --frozen --no-sync pytest -v --tb=short -m "not benchmark" --override-ini="addopts=-ra -q --strict-markers -n auto --dist loadgroup --max-worker-restart=0" tests/test_phaselock.py tests/test_runner_validation.py tests/test_runner_error_handling.py tests/test_queue_config_defaults.py tests/test_sqlite_setup_contention.py

    - name: Run Windows phaselock fallback-path gate with coverage
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      timeout-minutes: 45
      env:
        PHASELOCK_ENABLE_XATTRS: "0"
        COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync pytest --tb=short -m "not benchmark" --override-ini="addopts=-ra -vv --strict-markers -n auto --dist loadgroup --timeout=180 --timeout-method=thread --max-worker-restart=0" --cov=simplebroker --cov=extensions/simplebroker_pg/simplebroker_pg --cov=extensions/simplebroker_redis/simplebroker_redis --cov-append --cov-report= --cov-fail-under=0 tests/test_phaselock.py tests/test_runner_validation.py tests/test_runner_error_handling.py tests/test_queue_config_defaults.py tests/test_sqlite_setup_contention.py

    - name: Test CLI installation
      run: |
        uv run --frozen --no-sync broker --version
        uv run --frozen --no-sync simplebroker --version

    - name: Prepare Windows coverage data
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      env:
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync python .github/scripts/combine_coverage.py
        uv run --frozen --no-sync python -c "from pathlib import Path; Path('.coverage').replace('.coverage.windows')"

    - name: Upload Windows coverage data
      if: matrix.os == 'windows-latest' && matrix.python-version == '3.14'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-windows
        path: .coverage.windows
        include-hidden-files: true
        if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --extra pg --extra redis --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Test Python examples
      run: uv run --frozen --no-sync pytest -n auto examples

    - name: Validate full state-machine manifest
      run: SIMPLEBROKER_REQUIRE_FULL_MANIFEST=1 uv run --frozen --no-sync pytest -q tests/test_state_machine_policy.py

    - name: Type check Python examples
      run: uv run --frozen --no-sync python bin/release.py --check-example-types

    - name: Run linting with ruff
      run: |
        uv run --frozen --no-sync ruff check .

    - name: Check generated Ruff suppression index
      run: uv run --frozen --no-sync python bin/ruff_suppression_index.py --check

    - name: Check formatting with ruff
      run: |
        uv run --frozen --no-sync ruff format --check simplebroker tests bin .github/scripts extensions/simplebroker_pg/simplebroker_pg extensions/simplebroker_pg/tests extensions/simplebroker_redis/simplebroker_redis extensions/simplebroker_redis/tests

    - name: Type check with mypy
      run: |
        mapfile -t core_test_files < <(find tests -type f -name '*.py' -not -path '*/__pycache__/*' | sort)
        mapfile -t pg_test_files < <(find extensions/simplebroker_pg/tests -type f -name '*.py' -not -path '*/__pycache__/*' | sort)
        mapfile -t redis_test_files < <(find extensions/simplebroker_redis/tests -type f -name '*.py' -not -path '*/__pycache__/*' | sort)
        uv run --frozen --no-sync mypy simplebroker bin/release.py bin/ruff_suppression_index.py extensions/simplebroker_pg/simplebroker_pg extensions/simplebroker_redis/simplebroker_redis --config-file pyproject.toml
        MYPYPATH=. uv run --frozen --no-sync mypy --config-file pyproject.toml --namespace-packages --explicit-package-bases --allow-untyped-defs --allow-incomplete-defs "${core_test_files[@]}"
        uv run --frozen --no-sync mypy extensions/simplebroker_pg/simplebroker_pg "${pg_test_files[@]}" --config-file pyproject.toml
        uv run --frozen --no-sync mypy extensions/simplebroker_redis/simplebroker_redis "${redis_test_files[@]}" --config-file pyproject.toml

  packaging:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Run packaging smoke
      run: |
        uv sync --frozen --extra dev --python "${{ steps.sync-python.outputs.python-path }}"
        uv run --frozen --no-sync ./bin/packaging-smoke --python 3.11

  coverage-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      HYPOTHESIS_PROFILE: ci
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Run tests with coverage
      env:
        PYTEST_ADDOPTS: -ra -vv --strict-markers -n auto --dist loadgroup --timeout=180 --timeout-method=thread --max-worker-restart=0
        COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync coverage erase
        uv run --frozen --no-sync pytest --cov=simplebroker --cov-append --cov-report= --cov-fail-under=0 -m "not benchmark"
        uv run --frozen --no-sync python .github/scripts/combine_coverage.py
        uv run --frozen --no-sync python -c "from pathlib import Path; Path('.coverage').replace('.coverage.linux')"

    - name: Upload Linux coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-linux
        path: .coverage.linux
        include-hidden-files: true
        if-no-files-found: error

  coverage-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_pg/pyproject.toml
          extensions/simplebroker_pg/uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --extra pg --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Run PostgreSQL tests with coverage
      env:
        COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync coverage erase
        PYTEST_ADDOPTS= uv run --frozen --no-sync ./bin/pytest-pg --fast -vv --timeout=180 --timeout-method=thread --max-worker-restart=0 --cov=simplebroker --cov=extensions/simplebroker_pg/simplebroker_pg --cov-append --cov-report= --cov-fail-under=0
        uv run --frozen --no-sync python .github/scripts/combine_coverage.py
        uv run --frozen --no-sync python -c "from pathlib import Path; Path('.coverage').replace('.coverage.postgres')"

    - name: Upload PostgreSQL coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-postgres
        path: .coverage.postgres
        include-hidden-files: true
        if-no-files-found: error

  coverage-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --extra redis --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Run Redis/Valkey tests with coverage
      env:
        COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync coverage erase
        PYTEST_ADDOPTS= uv run --frozen --no-sync ./bin/pytest-redis --fast -vv --timeout=180 --timeout-method=thread --max-worker-restart=0 --cov=simplebroker --cov=extensions/simplebroker_redis/simplebroker_redis --cov-append --cov-report= --cov-fail-under=0
        uv run --frozen --no-sync python .github/scripts/combine_coverage.py
        uv run --frozen --no-sync python -c "from pathlib import Path; Path('.coverage').replace('.coverage.redis')"

    - name: Upload Redis/Valkey coverage data
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-redis
        path: .coverage.redis
        include-hidden-files: true
        if-no-files-found: error

  coverage-report:
    needs: [test, coverage-linux, coverage-postgres, coverage-redis]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Download coverage data
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name coverage-linux --dir .
        gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name coverage-postgres --dir .
        gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name coverage-redis --dir .
        gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name coverage-windows --dir .

    - name: Combine and enforce coverage
      env:
        COVERAGE_FILE: ${{ github.workspace }}/.coverage
      run: |
        uv run --frozen --no-sync python -c "from pathlib import Path; expected = (Path('.coverage.linux'), Path('.coverage.postgres'), Path('.coverage.redis'), Path('.coverage.windows')); missing = [str(path) for path in expected if not path.is_file()]; assert not missing, f'missing coverage data: {missing}'"
        uv run --frozen --no-sync python .github/scripts/combine_coverage.py
        uv run --frozen --no-sync coverage report --show-missing
        uv run --frozen --no-sync coverage xml

    - name: Trust pinned Codecov uploader key
      shell: bash
      run: |
        set -euo pipefail
        fingerprint=27034E7FDB850E0BBC2C62FF806BB28AED779869
        install -d -m 700 "${HOME}/.gnupg"
        curl --fail --silent --show-error https://keybase.io/codecovsecops/pgp_keys.asc | gpg --batch --import
        imported_fingerprint=$(gpg --batch --with-colons --fingerprint "${fingerprint}" | awk -F: '$1 == "fpr" { print $10; exit }')
        test "${imported_fingerprint}" = "${fingerprint}"
        printf '%s:6:\n' "${fingerprint}" | gpg --batch --import-ownertrust

    - name: Upload coverage reports
      id: codecov
      continue-on-error: true
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
      with:
        disable_search: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: VanL/simplebroker

    - name: Warn if Codecov upload failed
      if: steps.codecov.outcome == 'failure'
      run: echo "::warning::Codecov upload failed; local coverage gate passed"
