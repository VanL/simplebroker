name: Test Redis Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "latest"

jobs:
  test-redis:
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    # Job-level ceiling: the pytest wrappers do Docker/setup work before
    # pytest starts, which per-test timeouts can never bound (audit plan
    # Task 8.1).
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python ${{ matrix.python-version }}
      id: matrix-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: uv sync --frozen --extra dev --extra redis --python "${{ steps.matrix-python.outputs.python-path }}"

    - name: Verify matrix Python
      run: |
        uv run --frozen --no-sync python -c "import sys; expected = tuple(map(int, '${{ matrix.python-version }}'.split('.'))); actual = sys.version_info[:2]; sys.exit(f'expected Python {expected[0]}.{expected[1]}, got {actual[0]}.{actual[1]}') if actual != expected else None"

    - name: Report Python and SQLite versions
      run: |
        uv run --frozen --no-sync python -c "import sys, sqlite3, sysconfig; print(sys.version); print('SQLite', sqlite3.sqlite_version); print('Py_GIL_DISABLED', sysconfig.get_config_var('Py_GIL_DISABLED'))"

    - name: Run Redis-backed test suites
      run: |
        uv run --frozen --no-sync ./bin/pytest-redis --max-worker-restart=0

    - name: Run Redis cross-thread finalization probe
      if: matrix.python-version == '3.13' || matrix.python-version == '3.15'
      env:
        SIMPLEBROKER_RUN_FINALIZATION_PROBE: "1"
        PYTEST_ADDOPTS: ""
      run: |
        test "${SIMPLEBROKER_RUN_FINALIZATION_PROBE}" = "1"
        uv run --frozen --no-sync ./bin/pytest-redis --fast -n0 -q extensions/simplebroker_redis/tests/test_redis_cross_thread_generator_probe.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python
      id: sync-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          extensions/simplebroker_redis/pyproject.toml
          extensions/simplebroker_redis/uv.lock

    - name: Install dependencies
      run: uv sync --frozen --extra dev --extra redis --python "${{ steps.sync-python.outputs.python-path }}"

    - name: Run extension linting with ruff
      run: |
        uv run --frozen --no-sync ruff check extensions/simplebroker_redis/simplebroker_redis extensions/simplebroker_redis/tests

    - name: Check extension formatting with ruff
      run: |
        uv run --frozen --no-sync ruff format --check extensions/simplebroker_redis/simplebroker_redis extensions/simplebroker_redis/tests

    - name: Type check extension with mypy
      run: |
        mapfile -t redis_test_files < <(find extensions/simplebroker_redis/tests -type f -name '*.py' -not -path '*/__pycache__/*' | sort)
        uv run --frozen --no-sync mypy extensions/simplebroker_redis/simplebroker_redis "${redis_test_files[@]}" --config-file pyproject.toml
